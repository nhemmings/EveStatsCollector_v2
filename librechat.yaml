version: 1.3.9

endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://192.168.0.229:11434/v1/"
      models:
        default: ["llama3.1:8b", "qwen2.5:7b", "qwen2.5:14b", "qwen3:14b"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Ollama"
      dropParams:
        - "thinking"
        - "think"

mcpServers:
  eve_stats:
    type: stdio
    title: "EVE Stats Database"
    description: "Query live EVE Online ship jump and kill statistics from the eve_stats PostgreSQL database."
    command: postgres-mcp
    args:
      - "postgresql://eve_stats_readonly:${READONLY_PASSWORD}@${POSTGRES_HOST}:5432/eve_stats"
      - "--access-mode=restricted"
