services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: true
    ports:
      - "5341:80"
    volumes:
      - seqdata:/data

  app:
    build:
      context: .
      dockerfile: EveStatsCollector.App/Dockerfile
    env_file: .env
    environment:
      # Override connection strings: 'db' is the service name on the Docker network
      ConnectionStrings__EveStatsMigrations: >-
        Host=db;Port=5432;Database=eve_stats;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__EveStats: >-
        Host=db;Port=5432;Database=eve_stats;Username=eve_stats_app;Password=${APP_PASSWORD}
      ConnectionStrings__EveStatsReadonly: >-
        Host=db;Port=5432;Database=eve_stats;Username=eve_stats_readonly;Password=${READONLY_PASSWORD}
      # Seq is on the Docker network at http://seq (port 80 inside the network)
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: http://seq
      OpenTelemetry__OtlpEndpoint: http://seq/ingest/otlp
    depends_on:
      db:
        condition: service_healthy
      seq:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: EveStatsCollector.Api/Dockerfile
    env_file: .env
    environment:
      ConnectionStrings__EveStatsReadonly: >-
        Host=db;Port=5432;Database=eve_stats;Username=eve_stats_readonly;Password=${READONLY_PASSWORD}
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: http://seq
      OpenTelemetry__OtlpEndpoint: http://seq/ingest/otlp
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      seq:
        condition: service_started

volumes:
  pgdata:
  seqdata:
