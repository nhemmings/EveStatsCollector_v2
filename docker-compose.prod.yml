services:
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registrydata:/var/lib/registry

  app:
    image: 192.168.0.68:5000/evestatscollector:latest
    restart: unless-stopped
    environment:
      # External LXC postgres — POSTGRES_HOST is its static IP
      ConnectionStrings__EveStatsMigrations: >-
        Host=${POSTGRES_HOST};Port=5432;Database=eve_stats;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__EveStats: >-
        Host=${POSTGRES_HOST};Port=5432;Database=eve_stats;Username=eve_stats_app;Password=${APP_PASSWORD}
      ConnectionStrings__EveStatsReadonly: >-
        Host=${POSTGRES_HOST};Port=5432;Database=eve_stats;Username=eve_stats_readonly;Password=${READONLY_PASSWORD}
      DbMigrations__AppPassword: ${APP_PASSWORD}
      DbMigrations__ReadonlyPassword: ${READONLY_PASSWORD}
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: http://seq
      OpenTelemetry__OtlpEndpoint: http://seq/ingest/otlp
    depends_on:
      seq:
        condition: service_started

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: true
    ports:
      - "5341:80"
    volumes:
      - seqdata:/data

  api:
    image: 192.168.0.68:5000/evestatscollector-api:latest
    restart: unless-stopped
    environment:
      ConnectionStrings__EveStatsReadonly: >-
        Host=${POSTGRES_HOST};Port=5432;Database=eve_stats;Username=eve_stats_readonly;Password=${READONLY_PASSWORD}
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: http://seq
      OpenTelemetry__OtlpEndpoint: http://seq/ingest/otlp
    ports:
      - "8080:8080"
    depends_on:
      seq:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  registrydata:
  seqdata:
